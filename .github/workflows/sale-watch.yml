name: sale watch

# Watches Base on-chain for the one event neither the operator nor any tool can
# manufacture: a payment into the storefront's receive wallet from a wallet that
# is NOT ours. That is a stranger's agent actually buying.
#
# Chain scans only cover the last ~2 hours of blocks; RPC 429s and delayed
# self-hosted runs can leave blind spots. The storefront ledger (authoritative
# for settled sales on this box) is merged in every run so dedupe recovers
# anything that fell out of the block window. When one appears, the job opens a
# GitHub issue — the run stays green; the ISSUE is the alert, not a failed run.
#
# Caveat: if a second operator box ever buys from this storefront with its own
# wallet, add that address to OUR_WALLETS or it will read as a stranger.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 6
    env:
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
      USDC: '0x833589fcd6edb6e08f4c7c32d4f71b54bda02913'
      PAY_TO: '0x0d25A44f74868eCE53B305C97139CF4B62963410'
      # Keep in sync with OPERATOR_WALLETS on Render (public, not secrets).
      OUR_WALLETS: >-
        0x67ffc9b439ae24b0f7c7ca837c4adfafa06f9d38,
        0xc22c17fca624db679b2471f2bb099e1e29a46209,
        0xce2b941f877cc96b26fdd4a7eb2c1ef4b7369a51
      STOREFRONT_URL: 'https://x402-mcp.onrender.com'
      MAX_SALE_ALERTS_PER_RUN: '15'
      LEDGER_LOOKBACK_HOURS: '12'
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v5

      - name: Scan chain + ledger for stranger payments and alert
        run: python3 scripts/sale_watch_run.py