name: sale watch

# Watches Base on-chain for the one event neither the operator nor any tool can
# manufacture: a payment into the storefront's receive wallet from a wallet that
# is NOT ours. That is a stranger's agent actually buying.
#
# Every self-settle (cataloging, re-index) comes from the operator buyer wallet
# below, so anything else is a real external sale. When one appears, the job
# opens a GitHub issue — that notifies you and leaves a durable, dedup-able
# record. The run stays green; the ISSUE is the alert, not a failed run.
#
# Caveat: if a second operator box (the Linux instance) ever buys from this
# storefront with its own wallet, add that address to OUR_WALLETS or it will
# read as a stranger. Today only one buyer wallet exists.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      RPC: https://mainnet.base.org
      USDC: '0x833589fcd6edb6e08f4c7c32d4f71b54bda02913'
      PAY_TO: '0x05e1720bB82F86B5bc7940a99FDC702E32256357'
      # Comma-separated, lowercase. Every wallet WE settle from. Anything else
      # paying PAY_TO is a stranger.
      OUR_WALLETS: '0x67ffc9b439ae24b0f7c7ca837c4adfafa06f9d38'
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4

      - name: Scan Base for stranger payments and alert
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.request

          from alerts import Alerter, event_key

          RPC = os.environ["RPC"]
          USDC = os.environ["USDC"]
          PAY_TO = os.environ["PAY_TO"].lower()
          OURS = {w.strip().lower() for w in os.environ["OUR_WALLETS"].split(",") if w.strip()}
          REPO = os.environ["GH_REPO"]
          XFER = "0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef"

          def rpc(method, params, *, attempts: int = 6):
              payload = json.dumps(
                  {"jsonrpc": "2.0", "id": 1, "method": method, "params": params}
              ).encode()
              headers = {
                  "content-type": "application/json",
                  "user-agent": "x402-sale-watch/1.0",
              }
              delay_s = 1.0
              for attempt in range(attempts):
                  req = urllib.request.Request(RPC, data=payload, headers=headers)
                  try:
                      with urllib.request.urlopen(req, timeout=45) as resp:
                          return json.loads(resp.read())["result"]
                  except urllib.error.HTTPError as exc:
                      if exc.code in (429, 502, 503) and attempt + 1 < attempts:
                          print(
                              f"RPC {method} HTTP {exc.code}; "
                              f"retry {attempt + 2}/{attempts} in {delay_s:.1f}s"
                          )
                          time.sleep(delay_s)
                          delay_s = min(delay_s * 2, 30.0)
                          continue
                      raise
              raise RuntimeError(f"RPC {method} failed after {attempts} attempts")

          latest = int(rpc("eth_blockNumber", []), 16)
          # ~2s blocks; cron every 30 min. Scan the last ~2 hours (3600 blocks)
          # every run so a delayed/skipped run cannot miss a sale. The event key
          # in the alert title keeps the overlap harmless.
          start = max(0, latest - 3600)
          topic_to = "0x" + "0" * 24 + PAY_TO[2:]

          def fetch_transfer_logs(start_block: int, end_block: int, chunk_size: int = 900):
              logs = []
              current = start_block
              while current <= end_block:
                  to_block = min(end_block, current + chunk_size - 1)
                  try:
                      chunk = rpc("eth_getLogs", [{
                          "fromBlock": hex(current), "toBlock": hex(to_block),
                          "address": USDC, "topics": [XFER, None, topic_to],
                      }])
                  except urllib.error.HTTPError as exc:
                      if exc.code == 413 and chunk_size > 25:
                          chunk_size = max(25, chunk_size // 2)
                          print(
                              f"eth_getLogs 413 for {current}-{to_block}; "
                              f"retrying with chunk_size={chunk_size}"
                          )
                          continue
                      if exc.code == 429 and chunk_size > 25:
                          chunk_size = max(25, chunk_size // 2)
                          print(
                              f"eth_getLogs 429 for {current}-{to_block}; "
                              f"backing off 5s, chunk_size={chunk_size}"
                          )
                          time.sleep(5)
                          continue
                      raise
                  logs.extend(chunk)
                  current = to_block + 1
              return logs

          logs = fetch_transfer_logs(start, latest)

          strangers = []
          for lg in logs:
              frm = "0x" + lg["topics"][1][-40:]
              if frm.lower() in OURS:
                  continue
              amt = int(lg["data"], 16) / 1e6
              strangers.append((frm, amt, lg["transactionHash"], int(lg["blockNumber"], 16)))

          print(f"scanned {latest-start} blocks; {len(logs)} payments in, {len(strangers)} from strangers")

          alerter = Alerter(REPO, "sale")

          for frm, amt, tx, blk in strangers:
              alerter.alert(
                  event_key("sale", tx),
                  f"\U0001F4B0 External sale: ${amt:.4f} USDC from {frm[:10]}…",
                  f"A wallet that is not ours paid the storefront.\n\n"
                  f"- **Amount:** ${amt:.6f} USDC\n"
                  f"- **From:** `{frm}`\n"
                  f"- **To (pay_to):** `{PAY_TO}`\n"
                  f"- **Tx:** https://basescan.org/tx/{tx}\n"
                  f"- **Block:** {blk}\n\n"
                  f"This is a real external purchase — the first-ever was 0xadacdfdd on "
                  f"2026-07-22 (old $0.25 Pulse). Cross-check /ledger/revenue and /demand "
                  f"to see which product and client class. Close this issue once acknowledged.",
              )

          print(alerter.summary())
          PY
