name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python deps
        run: |
          python -m pip install -r requirements.txt
      - name: pytest
        env:
          # The SDK-middleware routes (/pilot/ping, /base/finality-check) are
          # only registered when a receive address is configured, so without
          # this CI 404s on endpoints that exist in production and six tests
          # fail that pass on any configured box. Public receive address, not a
          # secret — the same value is committed in sale-watch.yml. No spend
          # key is ever set in CI, so nothing here can move money.
          X402_PAY_TO_ADDRESS: '0x8A897D546c22d726b45Fa25F0EBB56207E63fF4e'
        run: python -m pytest -v
      - name: Dashboard deps
        working-directory: dashboard
        run: pnpm install --frozen-lockfile || pnpm install
      - name: vitest
        working-directory: dashboard
        run: pnpm vitest run